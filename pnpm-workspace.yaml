catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
  # The one vite-plus bundles; Stryker's runner needs it as a direct dependency.
  vitest: 5.1.0
  # Vite+ wants coverage providers at its bundled vitest exactly, so it moves with the one above.
  "@vitest/coverage-v8": 5.1.0
overrides:
  vite@*: "catalog:"
  # Audit fixes in Stryker's dependencies (dev-only); drop once Stryker takes them.
  qs@<6.16.1: ">=6.16.1 <7"
  minimatch@>=10 <11.0.1: "^11.0.1"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
